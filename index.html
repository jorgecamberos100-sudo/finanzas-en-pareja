<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="description" content="Finanzas en Pareja: control mutuo de ingresos, gastos, presupuesto por sobres, metas y deuda mutua. Gratis para los dos." />
    <title>Finanzas en Pareja</title>

    <!-- Iconos: favicon.ico real (lo genera scripts/generate-icons.mjs en postinstall),
         SVG diseñado para navegadores modernos y apple-touch-icon para iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />

    <!-- El manifest lo genera vite-plugin-pwa en el build (vite.config.ts).
         El public/manifest.webmanifest viejo se elimina: sobrescribía al bueno. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tipografía: una sola familia, Inter, para todo (títulos, montos e interfaz). Gratis, con swap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Tema antes de la primera pintura (sin flash de tema equivocado):
         lee la elección guardada (misma clave que src/lib/tema.ts) y pone
         data-theme en <html> antes de que se cargue ningún CSS de React. -->
    <script>
      ;(function () {
        var tema = 'noche'
        try {
          var guardado = localStorage.getItem('finanzas-tema')
          if (guardado === 'dia' || guardado === 'esmeralda') tema = 'dia'
        } catch (e) { /* almacenamiento bloqueado: noche */ }
        document.documentElement.dataset.theme = tema
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
